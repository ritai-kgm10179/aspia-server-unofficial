name: Auto-Update Aspia & Base Image

on:
  schedule:
    # 每天 UTC 03:00（台北時間 11:00）自動執行版本檢查
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild & publish even if version and base digest have not changed"
        type: boolean
        required: false
        default: false
      target_version:
        description: "Optional specific Aspia v3 version (leave empty for latest 3.x)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  check-updates:
    name: Check Upstream Aspia & Debian 13-slim Updates
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.check.outputs.current_version }}
      latest_version: ${{ steps.check.outputs.latest_version }}
      current_digest: ${{ steps.check.outputs.current_digest }}
      base_digest: ${{ steps.check.outputs.base_digest }}
      version_changed: ${{ steps.check.outputs.version_changed }}
      base_changed: ${{ steps.check.outputs.base_changed }}
      needs_update: ${{ steps.check.outputs.needs_update }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check latest Aspia v3 release and Debian 13-slim digest
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ inputs.target_version }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail

          current_version="$(tr -d ' \t\r\n' < VERSION)"
          current_digest="$(tr -d ' \t\r\n' < .base-digest)"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/dchapyshev/aspia/releases?per_page=30" \
            -o /tmp/releases.json

          req_ver="$(printf '%s' "${TARGET_VERSION}" | tr -d ' \t\r\n')"
          if [ -n "$req_ver" ]; then
            tag_name="$(jq -er --arg ver "$req_ver" '
              [ .[]
                | select(.tag_name == ("v" + $ver) or .tag_name == $ver)
                | select(any(.assets[]; .name | test("^aspia-router.*(x86_64|amd64).*\\.deb$")))
                | select(any(.assets[]; .name | test("^aspia-relay.*(x86_64|amd64).*\\.deb$")))
              ][0].tag_name
            ' /tmp/releases.json)"
          else
            tag_name="$(jq -er '
              [ .[]
                | select((.draft | not) and (.prerelease | not) and (.tag_name | test("^v?3\\.")))
                | select(any(.assets[]; .name | test("^aspia-router.*(x86_64|amd64).*\\.deb$")))
                | select(any(.assets[]; .name | test("^aspia-relay.*(x86_64|amd64).*\\.deb$")))
              ][0].tag_name
            ' /tmp/releases.json)"
          fi
          latest_version="${tag_name#v}"

          raw_manifest="$(docker buildx imagetools inspect debian:13-slim --raw)"
          base_digest="$(printf '%s' "$raw_manifest" | jq -r '
            if .manifests then
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest // empty)
            else
              empty
            end
          ')"
          if [ -z "$base_digest" ]; then
            base_digest="$(docker buildx imagetools inspect debian:13-slim --format '{{.Manifest.Digest}}')"
          fi

          version_changed="false"
          if [ "$latest_version" != "$current_version" ]; then
            version_changed="true"
          fi

          base_changed="false"
          if [ "$base_digest" != "$current_digest" ]; then
            base_changed="true"
          fi

          needs_update="false"
          if [ "$version_changed" = "true" ] || [ "$base_changed" = "true" ] || [ "$FORCE_REBUILD" = "true" ]; then
            needs_update="true"
          fi

          {
            echo "current_version=${current_version}"
            echo "latest_version=${latest_version}"
            echo "current_digest=${current_digest}"
            echo "base_digest=${base_digest}"
            echo "version_changed=${version_changed}"
            echo "base_changed=${base_changed}"
            echo "needs_update=${needs_update}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Auto-Update Check Summary"
            echo "| Item | Current | Upstream | Changed |"
            echo "| --- | --- | --- | --- |"
            echo "| Aspia v3 | \`${current_version}\` | \`${latest_version}\` | \`${version_changed}\` |"
            echo "| debian:13-slim (amd64) | \`${current_digest}\` | \`${base_digest}\` | \`${base_changed}\` |"
            echo ""
            echo "Force rebuild: \`${FORCE_REBUILD}\` -> **Needs update: \`${needs_update}\`**"
          } >> "$GITHUB_STEP_SUMMARY"

  create-update-pr:
    name: Create or Update Auto-Update PR
    needs: check-updates
    if: ${{ needs.check-updates.outputs.version_changed == 'true' || needs.check-updates.outputs.base_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_UPDATE_TOKEN || github.token }}

      - name: Create or update auto-update branch and PR
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN || github.token }}
          HAS_CUSTOM_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN != '' }}
          CURRENT_VERSION: ${{ needs.check-updates.outputs.current_version }}
          LATEST_VERSION: ${{ needs.check-updates.outputs.latest_version }}
          CURRENT_DIGEST: ${{ needs.check-updates.outputs.current_digest }}
          BASE_DIGEST: ${{ needs.check-updates.outputs.base_digest }}
          VERSION_CHANGED: ${{ needs.check-updates.outputs.version_changed }}
          BASE_CHANGED: ${{ needs.check-updates.outputs.base_changed }}
        run: |
          set -euo pipefail

          branch="chore/auto-update"
          git fetch origin "$branch" 2>/dev/null || true
          git checkout -B "$branch"

          printf '%s\n' "$LATEST_VERSION" > VERSION
          printf '%s\n' "$BASE_DIGEST" > .base-digest
          sed -i -E "s/^ARG ASPIA_VERSION=.*/ARG ASPIA_VERSION=${LATEST_VERSION}/" Dockerfile
          if [ "$VERSION_CHANGED" = "true" ] && [ -f arcane/registry.json ]; then
            jq --arg ver "$LATEST_VERSION" '.templates[0].version = $ver' arcane/registry.json > /tmp/registry.json
            mv /tmp/registry.json arcane/registry.json
          fi

          if [ "$VERSION_CHANGED" = "true" ] && [ "$BASE_CHANGED" = "true" ]; then
            commit_msg="chore: bump Aspia to v${LATEST_VERSION} and update debian:13-slim"
            pr_title="chore: 更新 Aspia v${LATEST_VERSION} 與 debian:13-slim 基底映像檔"
          elif [ "$VERSION_CHANGED" = "true" ]; then
            commit_msg="chore: bump Aspia to v${LATEST_VERSION}"
            pr_title="chore: 更新 Aspia 至 v${LATEST_VERSION}"
          else
            commit_msg="chore: rebuild for debian:13-slim security update"
            pr_title="chore: 更新 debian:13-slim 基底映像檔以修補安全性更新"
          fi

          remote_exists="false"
          if git rev-parse -q --verify "refs/remotes/origin/${branch}" >/dev/null; then
            remote_exists="true"
          fi

          if [ "$remote_exists" = "true" ] \
            && git merge-base --is-ancestor HEAD "refs/remotes/origin/${branch}" \
            && git diff --quiet "refs/remotes/origin/${branch}" -- VERSION .base-digest Dockerfile arcane/registry.json; then
            push_status="skipped (branch already up to date)"
          elif ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION .base-digest Dockerfile arcane/registry.json
            git commit -m "$commit_msg"
            if [ "$remote_exists" = "true" ]; then
              git push --force-with-lease origin "HEAD:refs/heads/${branch}"
            else
              git push origin "HEAD:refs/heads/${branch}"
            fi
            push_status="pushed"
          else
            echo "No tracked file differences detected; exiting."
            exit 0
          fi

          {
            echo "## 自動化版本更新追蹤"
            echo ""
            echo "| 項目 | 目前版本／Digest | 上游最新 | 是否變動 |"
            echo "| --- | --- | --- | --- |"
            echo "| Aspia v3 | \`${CURRENT_VERSION}\` | \`${LATEST_VERSION}\` | \`${VERSION_CHANGED}\` |"
            echo "| debian:13-slim (amd64) | \`${CURRENT_DIGEST}\` | \`${BASE_DIGEST}\` | \`${BASE_CHANGED}\` |"
            echo ""
            echo "- 所有必要檢查（\`Lint Dockerfile & Shell Scripts\`、\`Resolve Aspia v3 Release Assets\`、\`Build, Compose Smoke Test & Trivy Scan\`）通過並合併至 \`main\` 後，\`Build, Test, Scan & Publish\` 將自動建置、弱點掃描、推送新版映像檔至 GHCR，並於版號更新時建立 GitHub Release。"
            if [ "$HAS_CUSTOM_TOKEN" != "true" ]; then
              echo "- ℹ️ **提示**：目前使用預設 \`GITHUB_TOKEN\` 建立 PR；依 GitHub 安全機制，預設權杖開立的 PR 不會自動觸發 \`pull_request\` 檢查工作流程。請於 PR 頁面先關閉再重新開啟一次以觸發這 3 項必要檢查，或於 **Settings → Secrets and variables → Actions** 新增 \`AUTO_UPDATE_TOKEN\` Secret 以實現全自動檢查與 Auto-merge。"
            fi
          } > /tmp/pr-body.md

          existing_pr="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "$pr_title" --body-file /tmp/pr-body.md
            pr_number="$existing_pr"
          else
            pr_url="$(gh pr create --base main --head "$branch" --title "$pr_title" --body-file /tmp/pr-body.md)"
            pr_number="$(printf '%s' "$pr_url" | sed -E 's|.*/pull/([0-9]+).*|\1|')"
          fi

          if gh pr merge --auto --squash "$pr_number" 2>/tmp/automerge.err; then
            automerge_status="enabled (squash)"
          else
            automerge_status="skipped ($(tr '\n' ' ' < /tmp/automerge.err))"
            echo "::notice::Auto-merge was skipped: ${automerge_status}"
          fi

          {
            echo "### Auto-Update PR Result"
            echo "- Branch: \`${branch}\` (${push_status})"
            echo "- Pull Request: #${pr_number}"
            echo "- Auto-merge: ${automerge_status}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-publish:
    name: Force Rebuild & Publish Images
    needs: [check-updates]
    if: ${{ inputs.force_rebuild == true && needs.check-updates.outputs.version_changed == 'false' && needs.check-updates.outputs.base_changed == 'false' }}
    permissions:
      contents: write
      packages: write
      security-events: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/build-and-publish.yml
    with:
      aspia_version: ${{ needs.check-updates.outputs.latest_version }}
      push_images: true
    secrets: inherit
