name: Build, Test, Scan & Publish

on:
  workflow_call:
    inputs:
      aspia_version:
        description: "Aspia version to build (defaults to VERSION file)"
        type: string
        required: false
        default: ""
      push_images:
        description: "Push built images to GHCR"
        type: boolean
        required: false
        default: true
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "arcane/**"
      - "assets/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      aspia_version:
        description: "Aspia version to build (defaults to VERSION file)"
        type: string
        required: false
        default: ""
      push_images:
        description: "Push built images to GHCR"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint Dockerfile & Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Lint shell scripts with ShellCheck
        run: shellcheck -S warning scripts/*.sh

  resolve:
    name: Resolve Aspia v3 Release Assets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      major: ${{ steps.meta.outputs.major }}
      minor: ${{ steps.meta.outputs.minor }}
      router_deb_url: ${{ steps.meta.outputs.router_deb_url }}
      relay_deb_url: ${{ steps.meta.outputs.relay_deb_url }}
      router_deb_sha256: ${{ steps.meta.outputs.router_deb_sha256 }}
      relay_deb_sha256: ${{ steps.meta.outputs.relay_deb_sha256 }}
      should_push: ${{ steps.meta.outputs.should_push }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Aspia release metadata and .deb URLs
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.aspia_version }}
          INPUT_PUSH: ${{ inputs.push_images }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          req_ver="$(printf '%s' "${INPUT_VERSION}" | tr -d ' \t\r\n')"
          if [ -z "$req_ver" ]; then
            req_ver="$(tr -d ' \t\r\n' < VERSION)"
          fi
          req_ver="${req_ver#v}"

          version=""
          router_deb_url=""
          relay_deb_url=""
          router_deb_sha256=""
          relay_deb_sha256=""
          source=""

          resolved_ver="$req_ver"
          if [ "$req_ver" = "latest" ] && curl -fsSL --retry 2 --retry-delay 2 "https://aspia.org/updates/stable.json" -o /tmp/stable.json 2>/dev/null; then
            candidate="$(jq -r '.targets.latest // empty' /tmp/stable.json)"
            candidate="${candidate#v}"
            if printf '%s' "$candidate" | grep -Eq '^([3-9]|[1-9][0-9]+)\.'; then
              resolved_ver="$candidate"
            fi
          fi

          if [ "$resolved_ver" != "latest" ] && curl -fsSL --retry 2 --retry-delay 2 "https://aspia.org/updates/versions/${resolved_ver}.json" -o /tmp/manifest.json 2>/dev/null; then
            base_path="$(jq -r '.path // empty' /tmp/manifest.json)"
            r_file="$(jq -r '[.packages.router.linux.x86_64[]? | select(.format == "deb")][0].file // empty' /tmp/manifest.json)"
            r_sha="$(jq -r '[.packages.router.linux.x86_64[]? | select(.format == "deb")][0].sha256 // empty' /tmp/manifest.json)"
            l_file="$(jq -r '[.packages.relay.linux.x86_64[]? | select(.format == "deb")][0].file // empty' /tmp/manifest.json)"
            l_sha="$(jq -r '[.packages.relay.linux.x86_64[]? | select(.format == "deb")][0].sha256 // empty' /tmp/manifest.json)"
            if [ -n "$base_path" ] && [ -n "$r_file" ] && [ -n "$l_file" ]; then
              version="$resolved_ver"
              router_deb_url="${base_path}/${r_file}"
              relay_deb_url="${base_path}/${l_file}"
              router_deb_sha256="$r_sha"
              relay_deb_sha256="$l_sha"
              source="aspia.org"
            fi
          fi

          if [ -z "$router_deb_url" ] || [ -z "$relay_deb_url" ]; then
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/dchapyshev/aspia/releases?per_page=30" \
              -o /tmp/releases.json

            if [ "$req_ver" = "latest" ]; then
              jq -e '
                [ .[]
                  | select((.draft | not) and (.prerelease | not) and (.tag_name | test("^v?([3-9]|[1-9][0-9]+)\\.")))
                  | select(any(.assets[]; .name | test("^aspia-router.*(x86_64|amd64).*\\.deb$")))
                  | select(any(.assets[]; .name | test("^aspia-relay.*(x86_64|amd64).*\\.deb$")))
                ][0]
              ' /tmp/releases.json > /tmp/release.json
            else
              jq -e --arg ver "$req_ver" '
                [ .[]
                  | select(.tag_name == ("v" + $ver) or .tag_name == $ver)
                ][0]
              ' /tmp/releases.json > /tmp/release.json
            fi

            tag_name="$(jq -er '.tag_name' /tmp/release.json)"
            version="${tag_name#v}"
            router_deb_url="$(jq -er '[.assets[] | select(.name | test("^aspia-router.*(x86_64|amd64).*\\.deb$"))][0].browser_download_url' /tmp/release.json)"
            relay_deb_url="$(jq -er '[.assets[] | select(.name | test("^aspia-relay.*(x86_64|amd64).*\\.deb$"))][0].browser_download_url' /tmp/release.json)"
            router_deb_sha256=""
            relay_deb_sha256=""
            source="github-releases"
          fi

          major="${version%%.*}"
          minor="${version%.*}"

          if [ "$EVENT_NAME" != "pull_request" ] && [ "$INPUT_PUSH" != "false" ]; then
            should_push="true"
          else
            should_push="false"
          fi

          {
            echo "version=${version}"
            echo "major=${major}"
            echo "minor=${minor}"
            echo "router_deb_url=${router_deb_url}"
            echo "relay_deb_url=${relay_deb_url}"
            echo "router_deb_sha256=${router_deb_sha256}"
            echo "relay_deb_sha256=${relay_deb_sha256}"
            echo "should_push=${should_push}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved Aspia v${version} via ${source} (router: ${router_deb_url}, relay: ${relay_deb_url}, push: ${should_push})"

  build-test-scan:
    name: Build, Compose Smoke Test & Trivy Scan
    needs: [lint, resolve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local Router image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: router
          platforms: linux/amd64
          load: true
          tags: aspia-local/router:test
          build-args: |
            ASPIA_VERSION=${{ needs.resolve.outputs.version }}
            ASPIA_ROUTER_DEB_URL=${{ needs.resolve.outputs.router_deb_url }}
            ASPIA_RELAY_DEB_URL=${{ needs.resolve.outputs.relay_deb_url }}
            ASPIA_ROUTER_DEB_SHA256=${{ needs.resolve.outputs.router_deb_sha256 }}
            ASPIA_RELAY_DEB_SHA256=${{ needs.resolve.outputs.relay_deb_sha256 }}
          cache-from: type=gha,scope=router
          cache-to: type=gha,mode=max,scope=router

      - name: Build local Relay image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: relay
          platforms: linux/amd64
          load: true
          tags: aspia-local/relay:test
          build-args: |
            ASPIA_VERSION=${{ needs.resolve.outputs.version }}
            ASPIA_ROUTER_DEB_URL=${{ needs.resolve.outputs.router_deb_url }}
            ASPIA_RELAY_DEB_URL=${{ needs.resolve.outputs.relay_deb_url }}
            ASPIA_ROUTER_DEB_SHA256=${{ needs.resolve.outputs.router_deb_sha256 }}
            ASPIA_RELAY_DEB_SHA256=${{ needs.resolve.outputs.relay_deb_sha256 }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay

      - name: Run Compose end-to-end smoke test
        env:
          IMAGE_PREFIX: aspia-local
          ASPIA_IMAGE_TAG: test
          ASPIA_RELAY_PUBLIC_ADDRESS: 127.0.0.1
        run: |
          set -euo pipefail

          cleanup() {
            docker compose down -v --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose up -d

          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            router_health="$(docker inspect -f '{{.State.Health.Status}}' aspia-router 2>/dev/null || echo 'starting')"
            relay_health="$(docker inspect -f '{{.State.Health.Status}}' aspia-relay 2>/dev/null || echo 'starting')"
            echo "Healthcheck status -> aspia-router: ${router_health}, aspia-relay: ${relay_health}"
            if [ "$router_health" = "healthy" ] && [ "$relay_health" = "healthy" ]; then
              break
            fi
            sleep 2
          done

          [ "$(docker inspect -f '{{.State.Health.Status}}' aspia-router)" = "healthy" ]
          [ "$(docker inspect -f '{{.State.Health.Status}}' aspia-relay)" = "healthy" ]

          # 驗證容器皆以非特權使用者 (UID 1000) 執行
          [ "$(docker exec aspia-router id -u)" = "1000" ]
          [ "$(docker exec aspia-relay id -u)" = "1000" ]

          # 驗證 Router 初始化檔案與公開金鑰傳遞是否正常
          docker exec aspia-router test -s /etc/aspia/router.conf
          docker exec aspia-router test -s /etc/aspia/host.pub
          docker exec aspia-router test -s /etc/aspia/relay.pub
          docker exec aspia-router test -s /var/lib/aspia/router.db3
          docker exec aspia-relay test -s /run/aspia-keys/relay.pub
          docker exec aspia-relay test -s /etc/aspia/relay.conf

          # 驗證 Relay 無法存取 Router 的私密設定檔與資料庫
          docker exec aspia-relay sh -c '! test -e /etc/aspia/router.conf && ! test -e /var/lib/aspia/router.db3'

          # 驗證唯讀根檔案系統限制生效
          docker exec aspia-router sh -c '! touch /etc/aspia_ro_probe 2>/dev/null'
          docker exec aspia-relay sh -c '! touch /etc/aspia_ro_probe 2>/dev/null'

          echo "=== Sanitized Router Logs ==="
          docker logs aspia-router 2>&1 | sed -E 's/(Password:[[:space:]]*).*/\1[REDACTED]/g'
          echo "=== Relay Logs ==="
          docker logs aspia-relay 2>&1

      - name: Run Compose upgrade compatibility smoke test
        env:
          GH_TOKEN: ${{ github.token }}
          ASPIA_RELAY_PUBLIC_ADDRESS: 127.0.0.1
        run: |
          set -euo pipefail

          repo_lower="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          prev_prefix="ghcr.io/${repo_lower}"

          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1 || true

          if ! docker pull "${prev_prefix}/router:latest" >/dev/null 2>&1 \
            || ! docker pull "${prev_prefix}/relay:latest" >/dev/null 2>&1; then
            echo "::notice::Published :latest images not found or inaccessible for ${prev_prefix}; skipping upgrade compatibility test."
            exit 0
          fi

          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "=== Upgrade Smoke Test Failure Diagnostics ==="
              docker ps -a || true
              echo "=== Router Logs ==="
              docker logs aspia-router 2>&1 | sed -E 's/(Password:[[:space:]]*).*/\1[REDACTED]/g' || true
              echo "=== Relay Logs ==="
              docker logs aspia-relay 2>&1 || true
            fi
            IMAGE_PREFIX=aspia-local ASPIA_IMAGE_TAG=test docker compose down -v --remove-orphans || true
          }
          trap cleanup EXIT

          wait_healthy() {
            deadline=$((SECONDS + 90))
            while [ "$SECONDS" -lt "$deadline" ]; do
              router_health="$(docker inspect -f '{{.State.Health.Status}}' aspia-router 2>/dev/null || echo 'starting')"
              relay_health="$(docker inspect -f '{{.State.Health.Status}}' aspia-relay 2>/dev/null || echo 'starting')"
              echo "Upgrade test healthcheck -> aspia-router: ${router_health}, aspia-relay: ${relay_health}"
              if [ "$router_health" = "healthy" ] && [ "$relay_health" = "healthy" ]; then
                break
              fi
              sleep 2
            done

            [ "$(docker inspect -f '{{.State.Health.Status}}' aspia-router)" = "healthy" ]
            [ "$(docker inspect -f '{{.State.Health.Status}}' aspia-relay)" = "healthy" ]
          }

          # 階段 1：使用已發布的 :latest 映像檔初始化既有磁碟區與自訂 [smtp] 設定（不重複區段）
          IMAGE_PREFIX="$prev_prefix" ASPIA_IMAGE_TAG="latest" docker compose up -d
          wait_healthy

          prev_host_pub="$(docker exec aspia-router cat /etc/aspia/host.pub)"
          prev_relay_pub="$(docker exec aspia-router cat /etc/aspia/relay.pub)"
          [ -n "$prev_host_pub" ] && [ -n "$prev_relay_pub" ]
          docker exec aspia-router test -s /var/lib/aspia/router.db3
          docker exec aspia-router sh -c '. /usr/local/lib/aspia/lib-ini.sh && ini_set /etc/aspia/router.conf smtp port 2525 && printf "\n# upgrade-smoke-marker\n" >> /etc/aspia/router.conf'

          # 階段 2：保留既有磁碟區並原地切換為本次建置的新版映像檔
          IMAGE_PREFIX="aspia-local" ASPIA_IMAGE_TAG="test" docker compose up -d --force-recreate
          wait_healthy

          [ "$(docker exec aspia-router cat /etc/aspia/host.pub)" = "$prev_host_pub" ]
          [ "$(docker exec aspia-router cat /etc/aspia/relay.pub)" = "$prev_relay_pub" ]
          [ "$(docker exec aspia-relay cat /run/aspia-keys/relay.pub)" = "$prev_relay_pub" ]
          docker exec aspia-router test -s /var/lib/aspia/router.db3
          docker exec aspia-router sh -c '. /usr/local/lib/aspia/lib-ini.sh && [ "$(ini_get /etc/aspia/router.conf smtp port)" = "2525" ]'
          docker exec aspia-router grep -qx '# upgrade-smoke-marker' /etc/aspia/router.conf

          echo "Upgrade compatibility smoke test passed (${prev_prefix}:latest -> aspia-local:test)."

      - name: Scan Router image with Trivy (table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aspia-local/router:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan Relay image with Trivy (table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aspia-local/relay:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Generate Trivy SARIF for Router
        if: ${{ github.event_name != 'pull_request' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aspia-local/router:test
          format: sarif
          output: trivy-router.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Router Trivy SARIF
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: trivy-router.sarif
          category: trivy-router

      - name: Generate Trivy SARIF for Relay
        if: ${{ github.event_name != 'pull_request' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aspia-local/relay:test
          format: sarif
          output: trivy-relay.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Relay Trivy SARIF
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          sarif_file: trivy-relay.sarif
          category: trivy-relay

  publish:
    name: Publish ${{ matrix.target }} to GHCR
    needs: [resolve, build-test-scan]
    if: ${{ needs.resolve.outputs.should_push == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [router, relay]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=${{ needs.resolve.outputs.minor }}
            type=raw,value=${{ needs.resolve.outputs.major }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            ASPIA_VERSION=${{ needs.resolve.outputs.version }}
            ASPIA_ROUTER_DEB_URL=${{ needs.resolve.outputs.router_deb_url }}
            ASPIA_RELAY_DEB_URL=${{ needs.resolve.outputs.relay_deb_url }}
            ASPIA_ROUTER_DEB_SHA256=${{ needs.resolve.outputs.router_deb_sha256 }}
            ASPIA_RELAY_DEB_SHA256=${{ needs.resolve.outputs.relay_deb_sha256 }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  release:
    name: Create GitHub Release
    needs: [resolve, publish]
    if: ${{ needs.resolve.outputs.should_push == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release for new version
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          repo_version="$(tr -d ' \t\r\n' < VERSION)"
          base_digest="$(tr -d ' \t\r\n' < .base-digest)"
          if [ "$RESOLVED_VERSION" != "$repo_version" ]; then
            echo "::notice::Built version (${RESOLVED_VERSION}) differs from VERSION (${repo_version}) on main; skipping GitHub Release creation."
            exit 0
          fi

          tag="v${RESOLVED_VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            repo_lower="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Aspia Docker Server ${tag}" \
              --notes "$(printf 'Automated release tracking upstream [dchapyshev/aspia %s](https://github.com/dchapyshev/aspia/releases/tag/%s) on `debian:stable-slim` (`%s`).\n\n### Container Images\n- `ghcr.io/%s/router:%s`\n- `ghcr.io/%s/relay:%s`' "$tag" "$tag" "$base_digest" "$repo_lower" "$RESOLVED_VERSION" "$repo_lower" "$RESOLVED_VERSION")"
          else
            echo "GitHub Release ${tag} already exists; skipping."
          fi
